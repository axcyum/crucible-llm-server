name: Build iOS IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Find and select Xcode with iOS SDK
        run: |
          # List available Xcode versions
          ls /Applications/ | grep Xcode
          # Use latest available Xcode
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -showsdks | grep -i ios

      - name: Test OpenAI adapter
        run: |
          swiftc llama.swiftui/OpenAIChat.swift tests/OpenAIChatTests.swift -o /tmp/chat-adapter-tests
          /tmp/chat-adapter-tests

      - name: Build llama.cpp iOS xcframework
        run: python3 scripts/build-ios-framework.py

      - name: Build iOS app
        run: |
          xcodebuild build \
            -project llama.swiftui.xcodeproj \
            -scheme llama.swiftui \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/CrucibleLLM.app"
          test -d "$APP_PATH"
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r CrucibleLLM.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CrucibleLLM
          path: CrucibleLLM.ipa
          if-no-files-found: error
